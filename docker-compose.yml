###############################################################################
# AxonVoice OS — docker-compose.yml
#
# OLLAMA STRATEGY — ARCHITECTURAL DECISION (ADR-001-D):
#   Ollama runs NATIVELY on the host — NOT inside Docker by default.
#   Docker Desktop WSL2 enforces a VRAM ceiling; native gets full GPU access.
#   Docker services reach it via:  http://host.docker.internal:11434
#
#   Opt-in Docker Ollama (requires confirmed WSL2 GPU passthrough):
#     docker-compose --profile gpu-docker up ollama-engine
###############################################################################

services:

  # ═══════════════════════ INFRASTRUCTURE ════════════════════════════════════

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: axon_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: axon_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: axon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══════════════════════ OLLAMA — OPT-IN (see header) ══════════════════════

  ollama-engine:
    profiles: [gpu-docker]
    image: ollama/ollama:latest
    container_name: axon_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ═══════════════════════ BACKEND SERVICES ══════════════════════════════════

  axon-gateway:
    build:
      context: .
      dockerfile: backend/services/Gateway/Dockerfile
    container_name: axon_gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  axon-orchestrator:
    build:
      context: .
      dockerfile: backend/services/Orchestrator/Dockerfile
    container_name: axon_orchestrator
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ORCHESTRATOR_PORT:-5001}:8080"
    volumes:
      - ./infra/audio:/app/audio:ro   # Filler audio files (not baked into image)
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  axon-agent:
    build:
      context: .
      dockerfile: backend/services/AgentService/Dockerfile
    container_name: axon_agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "${AGENT_PORT:-5002}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  axon-admin-api:
    build:
      context: .
      dockerfile: backend/services/AdminApi/Dockerfile
    container_name: axon_admin_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_API_PORT:-5003}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  axon-outbox-worker:
    build:
      context: .
      dockerfile: backend/services/OutboxWorker/Dockerfile
    container_name: axon_outbox_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy

  # ═══════════════════════ FRONTEND ══════════════════════════════════════════

  axon-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: axon_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      axon-gateway:
        condition: service_healthy

# ═══════════════════════ NAMED VOLUMES ════════════════════════════════════════

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  ollama_data:

# ═══════════════════════ NETWORK ══════════════════════════════════════════════

networks:
  default:
    name: axon_network
    driver: bridge
