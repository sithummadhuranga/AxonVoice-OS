###############################################################################
# AxonVoice OS — docker-compose.yml
#
# PROFILES:
#   (default / no profile) — Infrastructure only: Postgres, Redis, RabbitMQ
#   --profile services     — All .NET backend microservices
#   --profile production   — Everything including the React frontend
#   --profile gpu-docker   — Native Ollama inside Docker (WSL2 GPU passthrough)
#
# LOCAL DEV WORKFLOW:
#   Step 1:  docker-compose up -d                  ← infra only
#   Step 2:  dotnet run ...                        ← each service natively (hot-reload)
#   Step 3:  npm run dev --prefix frontend/        ← React dev server
#
# CI / STAGING WORKFLOW:
#   docker-compose --profile services --profile production up -d --build
#
# OLLAMA NOTE (ADR-001):
#   Ollama runs NATIVELY on host for full GPU access.
#   Services reach it via http://host.docker.internal:11434
###############################################################################

services:

  # ═══════════════════════ INFRASTRUCTURE ════════════════════════════════════

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: axon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-axon_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-axon_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - axon_network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: axon_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axon_network

  redis:
    image: redis:7.4-alpine
    container_name: axon_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_pass_123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_pass_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axon_network

  # ═══════════════════════ OLLAMA — OPT-IN ════════════════════════════════════

  ollama-engine:
    profiles: [gpu-docker]
    image: ollama/ollama:latest
    container_name: axon_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - axon_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ═══════════════════════ BACKEND SERVICES ═══════════════════════════════════

  axon-gateway:
    profiles: [services, production]
    build:
      context: .
      dockerfile: backend/services/Gateway/Dockerfile
    image: axonvoice/gateway:latest
    container_name: axon_gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-axon_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-dev_redis_pass_123}"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672"
      Jwt__Issuer: "${JWT_ISSUER:-axon}"
      Jwt__Audience: "${JWT_AUDIENCE:-axon}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"
      Cors__AllowedOrigin: "${CORS_ALLOWED_ORIGIN:-http://localhost:3000}"
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - axon_network
    healthcheck:
      disable: true

  axon-orchestrator:
    profiles: [services, production]
    build:
      context: .
      dockerfile: backend/services/Orchestrator/Dockerfile
    image: axonvoice/orchestrator:latest
    container_name: axon_orchestrator
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-dev_redis_pass_123}"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    ports:
      - "${ORCHESTRATOR_PORT:-5001}:8080"
    volumes:
      - ./infra/audio:/app/audio:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axon_network

  axon-agent:
    profiles: [services, production]
    build:
      context: .
      dockerfile: backend/services/AgentService/Dockerfile
    image: axonvoice/agent:latest
    container_name: axon_agent
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-axon_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-dev_redis_pass_123}"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    ports:
      - "${AGENT_PORT:-5002}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - axon_network

  axon-admin-api:
    profiles: [services, production]
    build:
      context: .
      dockerfile: backend/services/AdminApi/Dockerfile
    image: axonvoice/admin-api:latest
    container_name: axon_admin_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-axon_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Issuer: "${JWT_ISSUER:-axon}"
      Jwt__Audience: "${JWT_AUDIENCE:-axon}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"
    ports:
      - "${ADMIN_API_PORT:-5003}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - axon_network

  axon-outbox-worker:
    profiles: [services, production]
    build:
      context: .
      dockerfile: backend/services/OutboxWorker/Dockerfile
    image: axonvoice/outbox-worker:latest
    container_name: axon_outbox_worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-axon_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - axon_network

  # ═══════════════════════ FRONTEND ═══════════════════════════════════════════

  axon-web:
    profiles: [production]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: axonvoice/web:latest
    container_name: axon_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - axon-gateway
    networks:
      - axon_network

# ═══════════════════════ NAMED VOLUMES ═════════════════════════════════════════

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  ollama_data:

# ═══════════════════════ NETWORK ════════════════════════════════════════════════

networks:
  axon_network:
    name: axon_network
    driver: bridge
