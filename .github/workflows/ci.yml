name: AxonVoice OS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ═══════════════════════ BACKEND CI ═══════════════════════════════════════
  backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # cache: true # Can be enabled when setup-dotnet fully supports .NET 10 caching heuristics

      - name: Restore Dependencies
        run: dotnet restore backend/AxonVoice.slnx

      - name: Build
        run: dotnet build backend/AxonVoice.slnx --configuration Release --no-restore

      # - name: Test
      #   run: dotnet test backend/AxonVoice.slnx --configuration Release --no-build --verbosity normal

  # ═══════════════════════ FRONTEND CI ══════════════════════════════════════
  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # Prevents CI failing on pedantic lint warnings initially

      - name: Build
        run: npm run build

  # ═══════════════════════ DOCKER CI ════════════════════════════════════════
  docker-validation:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [backend, frontend] # Only runs if code compiles
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create required .env file for build
        run: |
          echo "JWT_SECRET_KEY=ci_dummy_secret_key_minimum_32_chars_long" > .env
          echo "JWT_ISSUER=ci_dummy" >> .env
          echo "JWT_AUDIENCE=ci_dummy" >> .env

      - name: Verify Docker Compose Build
        # This confirms that all 5 Dockerfiles assemble cleanly and layer correctly
        run: docker compose --profile services build
